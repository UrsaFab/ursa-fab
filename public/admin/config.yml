backend:
  name: github
  repo: UrsaFab/ursa-fab
  branch: main
  base_url: https://auth.ursafab.co.uk
  auth_endpoint: auth

local_backend: true

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: portfolio
    label: Portfolio
    folder: src/content/portfolio
    create: true
    extension: md
    format: frontmatter
    fields:
      - { label: Display order, name: order, widget: number, value_type: int, min: 1, default: 1, hint: "Lower numbers appear first." }
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: summary, widget: text }
      - label: Gallery images
        name: images
        widget: image
        media_library:
          config:
            multiple: true
            max_files: 50
      - { label: Description, name: description, widget: markdown }

  - name: studiocarts
    label: Studio carts
    folder: src/content/studiocarts
    create: true
    extension: md
    format: frontmatter
    fields:
      - { label: Display order, name: order, widget: number, value_type: int, min: 1, default: 1, hint: "Lower numbers appear first." }
      - { label: Title, name: title, widget: string }
      - { label: Price, name: price, widget: number, value_type: int, min: 0 }
      - { label: Thumbnail, name: thumbnail, widget: image }
      - label: Gallery
        name: gallery
        widget: image
        media_library:
          config:
            multiple: true
            max_files: 50
      - { label: Description, name: description, widget: markdown }
