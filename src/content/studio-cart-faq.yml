items:
  - question: Can the dimensions be customised?
    answer: Yes - our parametric design process allows for any customisations to be
      easily-modelled and fully-costed, with no additional fee.
  - question: Do you ship studio carts across the UK?
    answer: Contact us with your delivery location and we can confirm available delivery or collection options.
  - question: How do I request a quote?
    answer: Email info@ursafab.co.uk with the design you are interested in and any required changes.
